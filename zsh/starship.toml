# -----------------------------------------------------------------------------
# File:    ~/.config/starship.toml
# Purpose: Minimal, performance-focused Starship prompt configuration
# Maintainer: <Mango Habanero> <main@mango-habanero.dev>
# Created: 2025-10-03
# SPDX-License-Identifier: MIT
#
# Design Philosophy:
#  - Show only essential, actionable information
#  - Optimize for speed (fast prompt rendering)
#  - uv-first Python workflow
#  - ASCII-safe by default (Nerd Font alternatives commented out)
#  - Context-aware (modules appear only when relevant)
#
# Performance Notes:
#  - scan_timeout reduced to 10ms (default: 30ms)
#  - All language modules use only_with_files detection
#  - Disabled unused modules entirely
#  - Right-aligned info keeps left side clean
# -----------------------------------------------------------------------------

# Global Configuration
# -----------------------------------------------------------------------------

# Don't add a newline before prompt (more compact)
add_newline = false

# Performance: reduce directory scanning timeout
scan_timeout = 10

# Performance: timeout for external commands (in milliseconds)
command_timeout = 500

# Prompt Format Definition
# -----------------------------------------------------------------------------
# Left side: Essential working context
# Right side: Metadata (time, duration, system info when relevant)

format = """
[](bold blue)\
$username\
$localip\
[](bold cyan)\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$golang\
$rust\
$docker_context\
$kubernetes\
$line_break\
$character"""

# Right-side format for metadata
right_format = """$cmd_duration"""

# Core Prompt Components
# -----------------------------------------------------------------------------

[character]
# ASCII-safe symbols (works everywhere)
success_symbol = "[\\$](bold green)"
error_symbol = "[x](bold red)"

# Nerd Font alternative (uncomment if you have Nerd Fonts installed):
# success_symbol = "[➜](bold green)"
# error_symbol = "[✗](bold red)"

[line_break]
disabled = true

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " RO"

# Show the full path in git repos, abbreviated elsewhere
format = "[$path]($style)[$read_only]($read_only_style) "

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# read_only = " "
# format = "[$path]($style)[$read_only]($read_only_style) "

# User & Host Information
# -----------------------------------------------------------------------------

[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user](bold green)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "@[$hostname](bold yellow) "
trim_at = "."
disabled = true  # Disabled in favor of localip

[localip]
ssh_only = false
format = '@[$localipv4](bold yellow) '
disabled = false

# Version Control
# -----------------------------------------------------------------------------

[git_branch]
symbol = "git "
style = "bold purple"
format = "on [$symbol$branch(:$remote_branch)]($style) "

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = " "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

# Show clear indicators for git state
conflicted = "CONFLICT "
ahead = "AHEAD${count} "
behind = "BEHIND${count} "
diverged = "DIVERGED "
untracked = "?${count} "
stashed = "STASH${count} "
modified = "M${count} "
staged = "S${count} "
renamed = "R${count} "
deleted = "D${count} "

# Python Development (uv-focused)
# -----------------------------------------------------------------------------

[python]
symbol = "py "
style = "bold yellow"
format = 'via [$symbol$version]($style) '

# uv convention: .venv directory
python_binary = [".venv/bin/python", "python3", "python"]
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "Pipfile"]
detect_folders = [".venv"]

# Show virtualenv name if active
pyenv_version_name = false
pyenv_prefix = ""

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = " "

# Node.js / JavaScript
# -----------------------------------------------------------------------------

[nodejs]
symbol = "node "
style = "bold green"
format = "via [$symbol$version]($style) "

# Only show when package.json exists
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = " "

# Go Development
# -----------------------------------------------------------------------------

[golang]
symbol = "go "
style = "bold cyan"
format = "via [$symbol$version]($style) "

# Only show in Go projects
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = " "

# Rust Development
# -----------------------------------------------------------------------------

[rust]
symbol = "rust "
style = "bold red"
format = "via [$symbol$version]($style) "

# Only show in Rust projects
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = " "

# Container & Orchestration
# -----------------------------------------------------------------------------

[docker_context]
symbol = "docker "
style = "bold blue"
format = "via [$symbol$context]($style) "

# Only show when docker files present
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = " "

[kubernetes]
symbol = "k8s "
style = "bold blue"
format = 'on [$symbol$context( \($namespace\))]($style) '

# Only show when kubectl context is set
disabled = false
detect_files = ["k8s", "kubernetes"]
detect_folders = ["k8s", "kubernetes"]
detect_extensions = []

# Show only when KUBECONFIG is set or in k8s directory
[kubernetes.context_aliases]
"dev" = "development"
"prod" = "production"
"stg" = "staging"

# Nerd Font alternative (uncomment if you have Nerd Fonts):
# symbol = "☸ "

# Command Execution Time
# -----------------------------------------------------------------------------

[cmd_duration]
min_time = 1_000  # Show for commands taking > 1 second
style = "bold yellow"
format = "took [$duration]($style) "
show_milliseconds = false
show_notifications = false

# Disabled Modules
# -----------------------------------------------------------------------------
# These are explicitly disabled to prevent Starship from checking them

[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[conda]
disabled = true  # Using uv instead

[package]
disabled = true  # Redundant with language-specific modules

[memory_usage]
disabled = true  # Use htop when needed

[battery]
disabled = true  # Use system tray

[time]
disabled = true  # Use watch/system clock

# Unused Language Modules (disabled for performance)
# -----------------------------------------------------------------------------

[dart]
disabled = true

[elixir]
disabled = true

[elm]
disabled = true

[erlang]
disabled = true

[haskell]
disabled = true

[java]
disabled = true

[julia]
disabled = true

[kotlin]
disabled = true

[lua]
disabled = true

[nim]
disabled = true

[ocaml]
disabled = true

[perl]
disabled = true

[php]
disabled = true

[purescript]
disabled = true

[ruby]
disabled = true

[scala]
disabled = true

[swift]
disabled = true

[terraform]
disabled = true

[vagrant]
disabled = true

[zig]
disabled = true

# Shell & System Info (minimal)
# -----------------------------------------------------------------------------

[shell]
disabled = true  # Usually obvious from the terminal emulator

[shlvl]
disabled = true  # Rarely useful

[status]
disabled = true  # Character module shows success/error

# Custom Modules (optional)
# -----------------------------------------------------------------------------
# Uncomment and customize as needed for project-specific context

# [custom.project_context]
# command = "echo ${PROJECT_NAME:-none}"
# when = '[ -n "$PROJECT_NAME" ]'
# format = "[$output]($style) "
# style = "bold cyan"

# Performance Testing
# -----------------------------------------------------------------------------
# To test prompt render time, run:
#   time starship prompt
#
# Target: < 50 ms for fast terminal response
# Acceptable: < 100 ms
# Slow: > 100 ms (review enabled modules)